<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU-Payment | خدمات مالية ومسابقات</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { width: 100%; max-width: 400px; border: 2px solid #0000FF; padding: 20px; border-radius: 15px; box-shadow: 0 0 15px rgba(0, 0, 255, 0.3); }
        h2 { color: #0000FF; text-align: center; margin-bottom: 20px; }
        h3 { color: #00FF00; text-align: center; margin-top: 20px; }
        input, button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 10px; background: #111; color: #fff; border: 1px solid #333; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; border: none; transition: 0.3s; }
        .pay-btn { background-color: #0000FF; color: #fff; }
        .contest-btn { background-color: #00FF00; color: #000; }
        .pay-btn:hover { background-color: #0000cc; }
        .contest-btn:hover { background-color: #00cc00; }
        hr { border: 0; border-top: 1px solid #333; margin: 25px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h2>سداد فاتورة الكهرباء</h2>
        <input type="text" id="meterNumber" placeholder="رقم العداد (12 رقم)">
        <input type="number" id="amount" placeholder="قيمة الفاتورة (جنيه)">
        <button class="pay-btn" onclick="payElectric()">طلب سداد الفاتورة</button>

        <hr>

        <h3>🎁 مسابقة الهاتف</h3>
        <p style="text-align: center; font-size: 14px;">شارك بـ 10 جنيهات فقط وزد فرص فوزك!</p>
        <button class="contest-btn" onclick="window.location.href='competition.html'">ادخل السحب الآن</button>
    </div>

    <script>
        function payElectric() {
            const meter = document.getElementById('meterNumber').value;
            const amount = document.getElementById('amount').value;
            if(meter.length >= 10 && amount > 0) {
                const msg = `طلب سداد فاتورة كهرباء:%0Aرقم العداد: ${meter}%0Aالمبلغ: ${amount} جنيه`;
                window.location.href = "https://wa.me/201014505254?text=" + msg;
            } else {
                alert("يرجى التأكد من رقم العداد والمبلغ.");
            }
        }
    </script>
</body>
</html>
