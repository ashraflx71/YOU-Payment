<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>YOU-Payment</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 400px; border: 2px solid #0000FF; padding: 20px; border-radius: 15px; }
        input, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="card" id="app">
        <h2>سداد فاتورة الكهرباء</h2>
        <input type="text" id="meter" placeholder="رقم العداد">
        <input type="number" id="amount" placeholder="المبلغ">
        <button onclick="processPayment()">سداد</button>
        <div id="response"></div>
    </div>

    <script>
        function processPayment() {
            const meter = document.getElementById('meter').value;
            document.getElementById('response').innerHTML = "<h3>تم استلام طلبك للعداد " + meter + "</h3><p>يرجى تحويل المبلغ وتأكيد العملية عبر الواتساب.</p>";
        }
    </script>
</body>
</html>
