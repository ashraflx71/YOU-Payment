<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سداد فواتير الكهرباء | YOU-Payment</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 400px; border: 2px solid #0000FF; padding: 20px; border-radius: 15px; }
        h2 { color: #0000FF; text-align: center; }
        input, button { width: 100%; padding: 15px; margin: 10px 0; font-size: 20px; border-radius: 10px; background: #111; color: #fff; border: 1px solid #333; }
        button { background-color: #0000FF; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>سداد فاتورة الكهرباء</h2>
        <input type="text" id="meterNumber" placeholder="رقم العداد (12 رقم)">
        <input type="number" id="amount" placeholder="قيمة الفاتورة (جنيه)">
        <button onclick="payElectric()">طلب سداد الفاتورة</button>
    </div>

    <script>
        function payElectric() {
            const meter = document.getElementById('meterNumber').value;
            const amount = document.getElementById('amount').value;
            if(meter.length >= 10 && amount > 0) {
                const msg = `طلب سداد فاتورة كهرباء:%0Aرقم العداد: ${meter}%0Aالمبلغ: ${amount} جنيه`;
                window.location.href = "https://wa.me/201014505254?text=" + msg;
            } else {
                alert("يرجى التأكد من رقم العداد والمبلغ.");
            }
        }
    </script>
</body>
</html>
