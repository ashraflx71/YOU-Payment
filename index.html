<!-- نموذج الطلب -->
<input type="text" id="meter" placeholder="رقم العداد">
<input type="number" id="amount" placeholder="المبلغ">
<button onclick="sendOrder()">سداد الفاتورة</button>

<!-- منطقة الرد التي تظهر فيها النتيجة -->
<div id="responseArea" style="margin-top: 20px; padding: 15px; border: 1px solid #00FF00; display: none;"></div>

<script>
function sendOrder() {
    const data = { meter: document.getElementById('meter').value, amount: document.getElementById('amount').value };
    
    fetch('/process', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(res => {
        const area = document.getElementById('responseArea');
        area.style.display = 'block';
        area.innerHTML = `<h3>${res.status}</h3><p>${res.details}</p><p>${res.next_step}</p>`;
    });
}
</script>
