<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU-Payment</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; padding: 20px; }
        .container { max-width: 400px; margin: auto; }
        select, input, button { width: 100%; padding: 15px; margin: 10px 0; font-size: 20px; border-radius: 8px; }
        button { background-color: #007bff; color: #fff; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>YOU-Payment</h2>
        <select id="method">
            <option value="01014505254">فودافون كاش: 01014505254</option>
            <option value="01280208018">إنستا باي: 01280208018</option>
        </select>
        <input type="number" id="amount" placeholder="المبلغ">
        <button onclick="pay()">تأكيد العملية</button>
    </div>
    <script>
        function pay() {
            const method = document.getElementById('method').value;
            const amount = document.getElementById('amount').value;
            alert("يرجى التحويل إلى: " + method + "\nالمبلغ: " + amount + "\nشكراً لاستخدامك YOU-Payment");
        }
    </script>
</body>
</html>
