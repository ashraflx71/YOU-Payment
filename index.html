<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU Payment - المحرك الذكي</title>
    <style>
        /* تصميم المحرك التقني - تباين عالٍ وأداء خفيف */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            font-size: 22px; /* الحجم المثالي الذي حددناه */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 90%;
            max-width: 450px;
            padding: 30px;
            border: 2px solid #ccff00; /* الإطار الأصفر الليموني الملكي */
            border-radius: 20px;
            background-color: #050505;
            box-shadow: 0 0 25px rgba(204, 255, 0, 0.15);
            text-align: center;
        }

        .logo {
            font-size: 50px;
            font-weight: bold;
            color: #ccff00;
            margin-bottom: 5px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        .brand-sub {
            color: #ccff00;
            font-size: 14px;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        label {
            display: block;
            text-align: right;
            margin-bottom: 10px;
            font-size: 18px;
            color: #ffffff;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 25px;
            background-color: #111;
            border: 1px solid #ccff00;
            border-radius: 12px;
            color: #ffffff;
            font-size: 20px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-width: 2px;
            box-shadow: 0 0 10px #ccff00;
        }

        .pay-btn {
            width: 100%;
            padding: 18px;
            background-color: #ccff00;
            color: #000000;
            border: none;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pay-btn:hover {
            background-color: #e6ff80;
            transform: scale(1.02);
        }

        #transaction-result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border: 1px dashed #ccff00;
            border-radius: 15px;
            background-color: #0a0a0a;
        }

        .tr-id {
            color: #ccff00;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            font-size: 26px;
            margin-top: 10px;
        }

        .footer-text {
            font-size: 12px;
            color: #444;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="logo">YOU</div>
        <div class="brand-sub">Secure Payment Engine</div>
        
        <form id="payForm">
            <label>رقم البطاقة البنكية</label>
            <input type="text" placeholder="0000 0000 0000 0000" required>

            <div style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>تاريخ الانتهاء</label>
                    <input type="text" placeholder="MM/YY" required>
                </div>
                <div style="flex: 1;">
                    <label>رمز CVV</label>
                    <input type="password" placeholder="***" required>
                </div>
            </div>

            <button type="submit" class="pay-btn" id="submitBtn">تأكيد العملية الآن</button>
        </form>

        <div id="transaction-result">
            <p style="margin: 0; color: #ffffff;">تمت المعالجة بنجاح ✅</p>
            <p style="font-size: 14px; color: #888;">رقم التتبع (Transaction ID):</p>
            <div class="tr-id" id="displayID"></div>
        </div>

        <div class="footer-text">
            مدعوم بواسطة Creative 2026 - التقنية الخضراء
        </div>
    </div>

    <script>
        document.getElementById('payForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = "جاري الاتصال بالمحرك...";
            btn.disabled = true;

            // توليد رقم العملية الذكي
            const newID = "YOU-" + Math.random().toString(36).substr(2, 9).toUpperCase();

            setTimeout(() => {
                document.getElementById('payForm').style.display = 'none';
                document.getElementById('transaction-result').style.display = 'block';
                document.getElementById('displayID').innerText = newID;
            }, 2500);
        });
    </script>
</body>
</html>
